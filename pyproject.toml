[project]
name = "context-cockpit"
version = "0.1.0"
description = "A production-grade, local developer cockpit for multi-agent .context and AGENTS.md coordination"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antigravity Engineering" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "watchdog>=5.0.0",
    "filelock>=3.15.0",
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[project.scripts]
context-cockpit = "context_cockpit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]
